    function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const nome = document.getElementById("nome").value;
        const area = document.getElementById("area").value;
        const texto = document.getElementById("relatorio").value;
        const linhas = doc.splitTextToSize(texto, 180);
        const data = new Date().toLocaleDateString('pt-BR');

        let y = 15;

        // Insere a logo se o código estiver preenchido
        if (logoBase64 && logoBase64.length > 50) {
            // Garante que o gerador leia o código corretamente
            const cleanBase64 = logoBase64.split(',')[1] || logoBase64;
            doc.addImage(cleanBase64, "PNG", 10, y, 30, 30); // Ajustado para 30x30 para manter o formato quadrado da logo
            y += 35;
        }

        doc.setFontSize(16);
        doc.text("Relatório Diário - " + data, 10, y);
        y += 10;

        doc.setFontSize(12);
        doc.text("Nome: " + nome, 10, y);
        y += 7;

        doc.text("Área: " + area, 10, y);
        y += 10;

        doc.text(linhas, 10, y);

        doc.save("Relatorio_" + data.replaceAll("/", "-") + ".pdf");
    }
