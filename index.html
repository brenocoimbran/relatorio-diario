
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Relatório Diário</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            margin-top: 15px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Relatório Diário</h2>
    <textarea id="relatorio" placeholder="Escreva seu relatório aqui..."></textarea>
    <br>
    <button onclick="gerarPDF()">Gerar PDF</button>

    <script>
        async function gerarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const texto = document.getElementById("relatorio").value;
            const linhas = doc.splitTextToSize(texto, 180);

            const data = new Date().toLocaleDateString('pt-BR');
            doc.setFontSize(16);
            doc.text("Relatório Diário - " + data, 10, 15);

            doc.setFontSize(12);
            doc.text(linhas, 10, 30);

            doc.save("Relatorio_Diario_" + data.replaceAll("/", "-") + ".pdf");
        }
    </script>

</body>
</html>
